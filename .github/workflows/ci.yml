name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      # Do not let one broken leg cancel the rest: with the default
      # `fail-fast: true` a single failing interpreter hides every other
      # result, which is how the Ubuntu 26.04 migration first surfaced.
      fail-fast: false
      matrix:
        include:
          # `ubuntu-latest` migrated to Ubuntu 26.04 in November 2026 and
          # actions/python-versions ships no 3.8/3.9 build for it (3.8 ends at
          # 3.8.18, 3.9 at 3.9.25, both capped at 24.04). Those legs stay on
          # ubuntu-24.04, the last image that provides a prebuilt interpreter;
          # every newer version keeps exercising the current `ubuntu-latest`.
          - python-version: "3.8"
            os: ubuntu-24.04
          - python-version: "3.9"
            os: ubuntu-24.04
          - python-version: "3.10"
            os: ubuntu-latest
          - python-version: "3.11"
            os: ubuntu-latest
          - python-version: "3.12"
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          pytest tests/ --tb=short -q

      - name: Coverage report
        if: matrix.python-version == '3.11'
        run: |
          pytest tests/ --cov=blackbox2c --cov-report=term-missing --cov-report=xml -q

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
